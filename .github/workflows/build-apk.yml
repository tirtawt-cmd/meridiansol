name: Build Meridian Safe APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MeridianSafe-v0.1-paper.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeridianSafe-v0.1-paper
          path: MeridianSafe-v0.1-paper.apk
          if-no-files-found: error
          retention-days: 30
